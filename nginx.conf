server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — required because the variable-based proxy_pass
    # blocks below resolve hostnames at request time, not at config-load time.
    # 127.0.0.11 resolves both container service names (spotify-proxy, searxng)
    # AND forwards external lookups to the host's upstream resolver (api.geoapify.com etc).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Proxy SearXNG JSON API
    location /searxng/ {
        proxy_pass http://searxng:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Qwen3-VL llama.cpp endpoint (OpenAI-compatible). SSE-capable.
    location /vlm/ {
        proxy_pass http://100.90.172.55:7998/;     # trailing slash strips /vlm/ prefix
        proxy_http_version 1.1;
        proxy_set_header Host 100.90.172.55:7998;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                       # required for SSE streaming
        proxy_cache off;
        proxy_read_timeout 600s;                   # VL prefill on Pascal can be slow
        proxy_send_timeout 600s;
        client_max_body_size 10m;                  # room for image payloads
    }

    # Proxy Geoapify (places, geocoding, reverse). Key in ?apiKey= query param.
    # Browser calls /geoapify/v1/geocode/search?text=geneva → upstream gets /v1/geocode/search?text=geneva&apiKey=KEY
    location ~ ^/geoapify/(.*)$ {
        proxy_pass https://api.geoapify.com/$1?$args&apiKey=${GEOAPIFY_API};
        proxy_http_version 1.1;
        proxy_set_header Host api.geoapify.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # Proxy Last.fm (artist bios, similar artists, top tracks). Key in ?api_key= query param.
    # Browser calls /lastfm/?method=artist.getinfo&artist=Coldplay → upstream gets /2.0/?method=...&api_key=KEY&format=json
    location ~ ^/lastfm/(.*)$ {
        proxy_pass https://ws.audioscrobbler.com/2.0/$1?$args&api_key=${LASTFM_API}&format=json;
        proxy_http_version 1.1;
        proxy_set_header Host ws.audioscrobbler.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # Proxy NewsData.io (news search + headlines). Key in ?apikey= query param.
    # Browser calls /newsdata/api/1/news?q=climate → upstream gets /api/1/news?q=climate&apikey=KEY
    location ~ ^/newsdata/(.*)$ {
        proxy_pass https://newsdata.io/$1?$args&apikey=${NEWSDATA_API};
        proxy_http_version 1.1;
        proxy_set_header Host newsdata.io;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # Proxy Spotify via local sidecar that handles client_credentials OAuth + token caching.
    # Browser calls /spotify/v1/search?q=daft+punk → spotify-proxy:8080 attaches Bearer token
    # → forwards to api.spotify.com.
    location ~ ^/spotify/(.*)$ {
        proxy_pass http://spotify-proxy:8080/$1?$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
