name: Code Review Pipeline

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

jobs:
  semgrep:
    name: Semgrep (SAST) + ReviewDog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep -> SARIF
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif || true
          semgrep scan --config auto --json --output semgrep.json || true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Install ReviewDog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
      - name: Post inline PR comments via ReviewDog
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewdog -f=sarif -reporter=github-pr-review < semgrep.sarif

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  trufflehog:
    name: TruffleHog (verified secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  trivy:
    name: Trivy (deps / IaC / misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan -> SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

  sonarqube:
    name: SonarQube CE Analysis
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codescene:
    name: CodeScene Code Health
    runs-on: ubuntu-latest
    if: ${{ vars.CODESCENE_ENABLED == 'true' }}
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CODESCENE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CodeScene CLI
        run: |
          curl -s https://downloads.codescene.io/enterprise/cli/install-cs-tool.sh | bash -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: CodeScene delta analysis
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          cs delta "origin/$BASE" --error-on-warnings --verbose
