services:
  fathom:
    build: .
    container_name: fathom
    restart: unless-stopped
    environment:
      # Keys injected into nginx.conf via envsubst at container start.
      GEOAPIFY_API: ${GEOAPIFY_API}
      LASTFM_API: ${LASTFM_API}
      NEWSDATA_API: ${NEWSDATA_API}
      # Limit envsubst to our API-key vars only — leaves nginx's $host, $args,
      # $remote_addr, $1, etc. literal so nginx itself can evaluate them.
      NGINX_ENVSUBST_FILTER: '^(GEOAPIFY_API|LASTFM_API|NEWSDATA_API)$$'
    ports:
      - "100.114.205.53:8889:3000"
    volumes:
      - /docker/fathom/assets:/usr/share/nginx/html/assets:ro
    networks:
      - searxng_default
    depends_on:
      - spotify-proxy

  spotify-proxy:
    build: ./spotify-proxy
    container_name: fathom-spotify-proxy
    restart: unless-stopped
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    networks:
      - searxng_default

networks:
  searxng_default:
    external: true
